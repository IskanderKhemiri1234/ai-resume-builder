<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد السير الذاتية بالذكاء الاصطناعي</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

  <div class="max-w-2xl w-full bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl border border-slate-700">
    <h1 class="text-3xl font-bold mb-2 text-indigo-400 text-center">مولّد السير الذاتية بالذكاء الاصطناعي 🚀</h1>
    <p class="text-slate-400 mb-6 text-center text-sm md:text-base">أدخل بياناتك وسيتم صياغة سيرة ذاتية احترافية لك خلال ثوانٍ</p>

    <form id="resumeForm" class="space-y-4">
      <div>
        <label class="block text-sm mb-1 font-medium text-slate-300">الاسم الكامل</label>
        <input type="text" id="fullName" required placeholder="مثال: إسكندر الخبيري" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-sm mb-1 font-medium text-slate-300">المسمى الوظيفي المستهدف</label>
        <input type="text" id="jobTitle" required placeholder="مثال: مطور ويب / مهندس برمجيات" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-sm mb-1 font-medium text-slate-300">الخبرات والمسار المهني</label>
        <textarea id="experience" rows="3" required placeholder="اكتب نبذة عن خبراتك والشركات التي عملت بها..." class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <div>
        <label class="block text-sm mb-1 font-medium text-slate-300">المهارات الرئيسية</label>
        <input type="text" id="skills" required placeholder="مثال: JavaScript, Next.js, القيادة, حل المشكلات" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg mt-2">
        توليد السيرة الذاتية ✨
      </button>
    </form>

    <div id="resultBox" class="hidden mt-8 p-6 bg-slate-700/50 rounded-xl border border-indigo-500/40">
      <h2 class="text-xl font-bold text-indigo-400 mb-3">السيرة الذاتية المقترحة:</h2>
      <div id="resumeOutput" class="text-slate-200 whitespace-pre-line leading-relaxed text-sm md:text-base"></div>
    </div>
  </div>

  <script>
    document.getElementById('resumeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');
      const resumeOutput = document.getElementById('resumeOutput');

      const name = document.getElementById('fullName').value;
      const jobTitle = document.getElementById('jobTitle').value;
      const experience = document.getElementById('experience').value;
      const skills = document.getElementById('skills').value;

      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري التوليد بواسطة الذكاء الاصطناعي... ⏳';
      resultBox.classList.add('hidden');

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, jobTitle, experience, skills })
        });

        const data = await response.json();

        if (response.ok) {
          resumeOutput.innerText = data.result;
          resultBox.classList.remove('hidden');
        } else {
          alert('خطأ: ' + (data.error || 'فشل في الاتصال بالذكاء الاصطناعي'));
        }
      } catch (err) {
        alert('حدث خطأ في الاتصال بالسيرفر');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'توليد السيرة الذاتية ✨';
      }
    });
  </script>
</body>
</html>
