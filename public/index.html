<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولّد السير الذاتية بالذكاء الاصطناعي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">
  <div class="max-w-3xl mx-auto px-4 py-10">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold text-indigo-400 mb-2">مولّد السير الذاتية بالذكاء الاصطناعي 🚀</h1>
      <p class="text-slate-400">أدخل بياناتك وسييتم صياغة سيرة ذاتية احترافية لك خلال ثوانٍ</p>
    </header>

    <!-- Form Container -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl mb-8">
      <form id="resumeForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">الاسم الكامل</label>
          <input type="text" id="name" required placeholder="مثال: إسكندر الخبيري" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">المسمى الوظيفي المستهدف</label>
          <input type="text" id="jobTitle" required placeholder="مثال: مطور ويب / مهندس برمجيات" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-300">لغة السيرة الذاتية</label>
            <select id="language" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
              <option value="ar">العربية 🇸🇦</option>
              <option value="en">English 🇬🇧</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1 text-slate-300">نبرة الصياغة</label>
            <select id="tone" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
              <option value="professional">احترافية ورسمية</option>
              <option value="creative">إبداعية وحماسية</option>
              <option value="concise">موجزة ومباشرة</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">الخبرات والمسار المهني</label>
          <textarea id="experience" rows="3" required placeholder="اكتب نبذة عن خبراتك والشركات التي عملت بها..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">المهارات الرئيسية</label>
          <input type="text" id="skills" required placeholder="مثال: JavaScript, Next.js, القيادة, حل المشكلات" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition duration-200">
          توليد السيرة الذاتية ✨
        </button>
      </form>
    </div>

    <!-- Output Section -->
    <div id="outputSection" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
        <h2 class="text-xl font-bold text-indigo-400">السيرة الذاتية الجاهزة:</h2>
        <button id="copyBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm px-4 py-2 rounded-lg transition">نسخ النص 📋</button>
      </div>
      <div id="result" class="prose prose-invert max-w-none text-slate-200 leading-relaxed space-y-2"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('resumeForm');
    const submitBtn = document.getElementById('submitBtn');
    const outputSection = document.getElementById('outputSection');
    const resultDiv = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري التوليد بواسطة الذكاء الاصطناعي... ⏳';
      outputSection.classList.add('hidden');

      const data = {
        name: document.getElementById('name').value,
        jobTitle: document.getElementById('jobTitle').value,
        language: document.getElementById('language').value,
        tone: document.getElementById('tone').value,
        experience: document.getElementById('experience').value,
        skills: document.getElementById('skills').value
      };

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const resData = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = marked.parse(resData.result);
          outputSection.classList.remove('hidden');
        } else {
          alert('خطأ: ' + (resData.error || 'حدث خطأ غير متوقع'));
        }
      } catch (err) {
        alert('تعذر الاتصال بالخادم.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'توليد السيرة الذاتية ✨';
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultDiv.innerText);
      copyBtn.innerText = 'تم النسخ! ✅';
      setTimeout(() => { copyBtn.innerText = 'نسخ النص 📋'; }, 2000);
    });
  </script>
</body>
</html>
