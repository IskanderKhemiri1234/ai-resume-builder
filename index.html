<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد السير الذاتية بالذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold text-center text-blue-400 mb-2">مولد السير الذاتية الذكي ✨</h1>
        <p class="text-gray-400 text-center mb-6">أنشئ سيرة ذاتية ورسالة تغطية احترافية في ثوانٍ معدودة</p>
        
        <form id="resumeForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">الاسم الكامل</label>
                <input type="text" placeholder="مثال: إسكندر الخميري" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">المسمى الوظيفي المستهدف</label>
                <input type="text" placeholder="مثال: مطور ويب / مدير تسويق" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">الخبرات والمهارات الرئيسية</label>
                <textarea rows="4" placeholder="اكتب المهارات الأساسية وسنوات الخبرة..." class="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500" required></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition duration-200">توليد السيرة الذاتية الآن 🚀</button>
        </form>
    </div>
</body>
</html>
