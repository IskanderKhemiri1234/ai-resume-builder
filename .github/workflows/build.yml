name: Khemiri AI - Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khemiri-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production website
        run: npm run build

      - name: Verify TypeScript
        run: npm run typecheck
